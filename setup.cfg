[metadata]
name = business-sales-intelligence-dashboard
version = 1.0.0
description = End-to-end sales data pipeline: cleaning, feature engineering, EDA, and reporting
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
author_email = your.email@example.com
license = MIT
keywords = data-science, pandas, matplotlib, sales-analytics, data-cleaning, eda
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Information Analysis
python_requires = >=3.10

[options]
packages = find:
install_requires =
    pandas>=2.2.0
    numpy>=1.26.0
    matplotlib>=3.8.0
    seaborn>=0.13.0
    faker>=24.0.0
    openpyxl>=3.1.0
    xlsxwriter>=3.2.0
    scipy>=1.13.0
